services:
  # Application (dev) database
  db:
    image: postgres:16-alpine
    container_name: pastel-todo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pastel_todo
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pastel_todo"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Separate test database (drops + resets between runs)
  test-db:
    image: postgres:16-alpine
    container_name: pastel-todo-test-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pastel_todo_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pastel_todo_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
